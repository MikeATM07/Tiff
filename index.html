<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0505">
<title>Tiffany</title>
<style>
  :root {
    --bg:#070404; --text:#f4e9e9; --muted:#b39a9a;
    --blood:#7a0010; --bordeaux:#4a0410; --red:#e3122d; --red2:#ff2a45;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body {
    min-height:100vh; color:var(--text); background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    overflow-x:hidden;
  }
  /* Ambient red glow */
  body::before {
    content:""; position:fixed; inset:-20%; z-index:0; pointer-events:none;
    background:
      radial-gradient(40% 35% at 50% 8%, rgba(122,0,16,.55), transparent 70%),
      radial-gradient(35% 30% at 85% 75%, rgba(74,4,16,.45), transparent 70%),
      radial-gradient(30% 30% at 10% 60%, rgba(122,0,16,.25), transparent 70%);
    animation:breathe 9s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{opacity:.85} 50%{opacity:1} }

  main { position:relative; z-index:1; max-width:460px; margin:0 auto; padding:20px 18px 32px; }

  /* Profile (compact) */
  .avatar-wrap {
    width:92px; height:92px; border-radius:50%; margin:0 auto; padding:3px;
    background:conic-gradient(from 200deg, var(--red2), var(--blood), #1a0306, var(--red), var(--red2));
    box-shadow:0 0 28px rgba(227,18,45,.45), 0 0 60px rgba(122,0,16,.35);
  }
  .avatar { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; border:3px solid var(--bg); background:#1a0a0c; }

  .head { text-align:center; }
  h1 { margin-top:10px; font-size:23px; font-weight:800; letter-spacing:.5px; line-height:1.15; }
  h1 span { color:var(--red); }
  .handle { margin:2px 0 16px; font-size:12px; color:var(--muted); letter-spacing:.5px; }
  .tag {
    display:inline-block; margin:9px 0 16px; padding:5px 13px; font-size:10px; letter-spacing:2.5px;
    text-transform:uppercase; font-weight:700; color:var(--red2);
    border:1px solid rgba(227,18,45,.45); border-radius:999px; background:rgba(74,4,16,.35);
  }

  /* OnlyFans hero card */
  a.of {
    position:relative; display:block; height:340px; height:clamp(300px, 50svh, 400px); border-radius:26px; overflow:hidden;
    text-decoration:none; color:#fff; isolation:isolate;
    background:#1a0306 url("of.jpg") center 25%/cover no-repeat;
    border:1px solid rgba(255,42,69,.55);
    box-shadow:0 0 0 1px rgba(122,0,16,.6), 0 18px 50px rgba(227,18,45,.35);
    animation:glow 2.8s ease-in-out infinite;
    transition:transform .2s;
  }
  a.of:hover, a.of:active { transform:translateY(-3px) scale(1.01); }
  @keyframes glow {
    0%,100% { box-shadow:0 0 0 1px rgba(122,0,16,.6), 0 18px 50px rgba(227,18,45,.30); }
    50%     { box-shadow:0 0 0 1px rgba(255,42,69,.8), 0 18px 64px rgba(227,18,45,.55); }
  }
  a.of::before {
    content:""; position:absolute; inset:0; z-index:-1;
    background:linear-gradient(to bottom, rgba(7,4,4,.15) 0%, rgba(7,4,4,.05) 35%, rgba(40,0,6,.75) 72%, rgba(7,4,4,.96) 100%);
  }
  .badge {
    position:absolute; top:14px; left:14px; display:flex; align-items:center; gap:7px;
    padding:6px 11px; border-radius:999px; font-size:10px; font-weight:800; letter-spacing:2px; text-transform:uppercase;
    background:rgba(7,4,4,.6); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,42,69,.5);
  }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--red2); box-shadow:0 0 10px var(--red2); animation:blink 1.4s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  .of-body { position:absolute; left:0; right:0; bottom:0; padding:18px 18px 16px; text-align:center; }
  .of-kicker { font-size:10px; letter-spacing:4px; text-transform:uppercase; color:var(--red2); font-weight:800; }
  .of-title { margin-top:5px; font-size:24px; font-weight:900; line-height:1.1; text-shadow:0 2px 14px rgba(0,0,0,.6); }
  .of-sub { margin-top:5px; font-size:13px; color:#e9d6d6; }
  .of-btn {
    position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:10px;
    margin-top:13px; padding:15px; border-radius:999px;
    background:linear-gradient(135deg, var(--red2), var(--red) 45%, var(--blood));
    font-size:14px; font-weight:900; letter-spacing:2.5px; text-transform:uppercase;
    box-shadow:0 10px 28px rgba(227,18,45,.5);
  }
  .of-btn::before {
    content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
    transform:skewX(-20deg); animation:shine 3.2s ease-in-out infinite;
  }
  @keyframes shine { 0%{left:-60%} 55%,100%{left:130%} }
  .of-btn svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }

  /* Socials */
  .sep { display:flex; align-items:center; gap:12px; margin:24px 6px 16px; font-size:10px; letter-spacing:4px; text-transform:uppercase; color:var(--muted); }
  .sep::before, .sep::after { content:""; flex:1; height:1px; background:linear-gradient(90deg, transparent, rgba(227,18,45,.5), transparent); }

  .socials { display:flex; justify-content:center; gap:18px; }
  .socials a {
    width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:var(--text); background:rgba(26,6,9,.85); border:1px solid rgba(227,18,45,.4);
    transition:transform .15s, background .15s, color .15s, box-shadow .15s;
  }
  .socials a:hover, .socials a:active { transform:translateY(-3px); color:#fff; background:var(--blood); box-shadow:0 8px 22px rgba(227,18,45,.4); }
  .socials svg { width:24px; height:24px; display:block; }
  .socials svg.s { fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .socials svg.f { fill:currentColor; }

  footer { margin-top:28px; text-align:center; font-size:11px; letter-spacing:1px; color:var(--muted); opacity:.7; }

  /* 18+ gate */
  .gate {
    position:fixed; inset:0; z-index:999; display:flex; align-items:center; justify-content:center; padding:16px;
    background:rgba(5,2,2,.75); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .gate[hidden] { display:none; }
  .gate-box {
    width:100%; max-width:340px; text-align:center; padding:28px 22px 22px;
    background:linear-gradient(180deg, #1a0609, #0c0405); border:1px solid rgba(227,18,45,.5); border-radius:26px;
    box-shadow:0 0 50px rgba(227,18,45,.3); animation:pop .2s ease-out;
  }
  @keyframes pop { from{transform:scale(.92); opacity:0} to{transform:scale(1); opacity:1} }
  .gate-title { font-size:22px; font-weight:900; margin-bottom:8px; }
  .gate-text { font-size:14px; line-height:1.5; color:var(--muted); margin-bottom:22px; }
  .gate-actions { display:flex; flex-direction:column; gap:10px; }
  .gate-actions button {
    font:inherit; font-size:13px; font-weight:800; letter-spacing:2px; text-transform:uppercase;
    padding:16px; border:none; border-radius:999px; cursor:pointer;
  }
  .gate-yes { color:#fff; background:linear-gradient(135deg, var(--red2), var(--red) 45%, var(--blood)); box-shadow:0 8px 22px rgba(227,18,45,.45); }
  .gate-no { color:var(--text); background:rgba(122,0,16,.25); border:1px solid rgba(227,18,45,.3) !important; }

  /* Small / short phones: tighten further so the whole OF card fits */
  @media (max-height:740px){
    main { padding-top:14px; }
    .avatar-wrap { width:80px; height:80px; }
    h1 { font-size:21px; margin-top:8px; }
    .tag { margin:7px 0 12px; }
    .of-title { font-size:22px; }
    .of-sub { font-size:12px; }
  }
  @media (max-width:380px){ .of-title { font-size:21px; } }
  @media (prefers-reduced-motion:reduce){ *, body::before { animation:none !important; } }
</style>
</head>
<body>
<main>
  <div class="avatar-wrap"><img class="avatar" src="avatar.jpg" alt="Tiffany"></div>

  <div class="head">
    <h1>Tiffany <span>🖤</span></h1>
    <p class="handle">@tiffany.afk</p>
  </div>

  <a class="of" href="#" onclick="openGate(event)" aria-label="Enter Mommy's private page">
    <span class="badge"><span class="dot"></span>18+ · Exclusive</span>
    <div class="of-body">
      <p class="of-kicker">Private access</p>
      <p class="of-title">Welcome to Mommy's world</p>
      <p class="of-sub">Come earn your place, good boy</p>
      <div class="of-btn">
        Enter now
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </div>
    </div>
  </a>

  <div class="sep">follow me</div>

  <div class="socials">
    <a href="https://www.instagram.com/tiffany.afk/" rel="noopener nofollow" aria-label="Instagram">
      <svg class="s" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
    </a>
    <a href="https://www.tiktok.com/@tiffany.afk" rel="noopener nofollow" aria-label="TikTok">
      <svg class="f" viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
    </a>
  </div>

  <footer>© 2026 Tiffany</footer>
</main>

<!-- 18+ gate -->
<div id="gate" class="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <div class="gate-box">
    <p id="gate-title" class="gate-title">18+ only 🔞</p>
    <p class="gate-text">Mommy's world is for adults only. are you 18+, good boy? 😏</p>
    <div class="gate-actions">
      <button class="gate-yes" onclick="enter()">yes, i'm 18+</button>
      <button class="gate-no" onclick="closeGate()">no, take me back</button>
    </div>
  </div>
</div>

<script>
  var OF_URL = 'https://onlyfans.com/tiffany.afk/c6';
  var gate = document.getElementById('gate');
  function openGate(e){ e.preventDefault(); gate.hidden = false; }
  function closeGate(){ gate.hidden = true; }
  function enter(){ window.location.href = OF_URL; }
  gate.addEventListener('click', function(e){ if (e.target === gate) closeGate(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeGate(); });
</script>
</body>
</html>
